name: Pruebas de calidad

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      evaluate_gemini:
        description: Evaluar el Golden Dataset con Gemini (10 solicitudes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install --requirement backend/requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest --quiet

      - name: Evaluar Golden Dataset con Gemini
        if: github.event_name == 'workflow_dispatch' && inputs.evaluate_gemini
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m pytest -q -s --gemini-live tests/test_sprint2_hitl_and_review.py -k golden_dataset_gemini
